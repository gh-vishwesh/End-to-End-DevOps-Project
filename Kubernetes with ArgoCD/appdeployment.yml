apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-pod
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: app-pod
  template:
    metadata:
      labels:
        app: app-pod
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app-pod
          # Jenkins rewrites the line below on every build with the image it pushed to ECR
          image: 013453151357.dkr.ecr.ap-south-1.amazonaws.com/python_web_application:build-4-614f1a4
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: tmp            # gunicorn worker heartbeat files; the rest of the filesystem is read-only
              mountPath: /tmp
          # Readiness keeps a pod out of the ALB until it serves pages; liveness restarts a hung server.
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3

          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: my-config
                  key: DB_HOST
            
            - name: DB_PORT
              value: "3306"

            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: my-config
                  key: DB_NAME

            - name: DB_USER
              value: root

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: my-secret
                  key: DB_PASSWORD

            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: my-secret
                  key: DJANGO_SECRET_KEY
                  optional: true
      volumes:
        - name: tmp
          emptyDir: {}
