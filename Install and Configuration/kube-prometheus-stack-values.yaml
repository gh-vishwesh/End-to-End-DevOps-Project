# Values for prometheus-community/kube-prometheus-stack on EKS.
# Install/upgrade:
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm upgrade -i monitoring prometheus-community/kube-prometheus-stack -n monitoring \
#     -f kube-prometheus-stack-values.yaml --set grafana.adminPassword='<password>'

# EKS runs these control-plane components itself and doesn't expose their metrics;
# leaving them on only produces permanent "target down" alerts.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false

prometheus:
  prometheusSpec:
    retention: 3d
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 1Gi
    # Pick up ServiceMonitors/PodMonitors/rules from any namespace, not just this release's
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    # Optional: also scrape Jenkins (needs the "Prometheus metrics" plugin on Jenkins).
    # Jenkins and the EKS nodes share the VPC, so the private IP works.
    # additionalScrapeConfigs:
    #   - job_name: jenkins
    #     metrics_path: /prometheus
    #     static_configs:
    #       - targets: ['<JENKINS_PRIVATE_IP>:8080']

alertmanager:
  # Optional e-mail notifications. Put the Gmail app password in a values file that is NOT committed,
  # e.g. -f alertmanager-secret-values.yaml, instead of editing it here.
  # config:
  #   global:
  #     smtp_smarthost: 'smtp.gmail.com:587'
  #     smtp_from: 'you@gmail.com'
  #     smtp_auth_username: 'you@gmail.com'
  #     smtp_auth_password: '<16-char app password>'
  #   route:
  #     receiver: email
  #     group_by: ['alertname', 'namespace']
  #     routes:
  #       - receiver: 'null'
  #         matchers: ['alertname = "Watchdog"']
  #   receivers:
  #     - name: email
  #       email_configs:
  #         - to: 'you@gmail.com'
  #           send_resolved: true
  #     - name: 'null'
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi

grafana:
  # Admin password is passed with --set grafana.adminPassword=... (kept out of git)
  # Grafana 13 builds its search indexes in memory; 256Mi got it OOMKilled
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 768Mi
  ingress:
    enabled: true
    ingressClassName: alb
    annotations:
      alb.ingress.kubernetes.io/load-balancer-name: grafana-alb
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
      alb.ingress.kubernetes.io/healthcheck-path: /api/health
    hosts: []
    path: /
    pathType: Prefix
